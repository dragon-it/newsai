name: Deploy NewsAI to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00)에 실행되도록 설정
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Pipeline Dependencies
        run: npm install

      - name: Run Pipeline (Fetch, Summarize, Gen JSON)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js || echo "Pipeline failed or missing env vars, continuing for build..."

      - name: Commit newly fetched data to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/ reports/ || echo "Files not found to add"
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update news data and reports"
          git push origin main || echo "No changes to push or push failed"

      - name: Build React Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
          # 날짜별 JSON 아카이브와 호환용 data.json을 배포 폴더로 복사
          cp -R ../data dist/data
          cp ../data.json dist/data.json || echo "[]" > dist/data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/dist
          publish_branch: gh-pages
